{% extends 'base.html' %}
{% block content %}
<div class="signup-container">
    <h2>Sign Up</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>
    <div class="nav-link">Already have an account? <a href="{% url 'login' %}">Login here</a></div>
</div>
{% endblock %}
