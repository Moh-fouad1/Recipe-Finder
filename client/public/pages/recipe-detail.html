<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Details</title>
  <link rel="stylesheet" href="../../src/styles/nav-bar.css">
  <link rel="stylesheet" href="../../src/styles/recipe-detail.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">Recipe<span>Finder</span></div>
    <ul class="nav-links" id="nav-links">
      <!-- Navigation will be updated by nav-bar.js -->
    </ul>
  </nav>

  <div class="container">
    <div id="recipe-detail" class="recipe-card">
      <!-- Content will be injected by JavaScript -->
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Recipe Finder Project</p>
  </footer>

  <script>
    // Simple function to get URL parameter
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function renderRecipeDetail() {
      const recipeId = getQueryParam('id');
      if (!recipeId) {
        document.getElementById('recipe-detail').innerHTML = '<p>No recipe specified.</p>';
        return;
      }

      const recipes = JSON.parse(localStorage.getItem('recipes')) || [];
      const recipe = recipes.find(r => r.id === recipeId);

      if (!recipe) {
        document.getElementById('recipe-detail').innerHTML = '<p>Recipe not found.</p>';
        return;
      }

      const ingredientsHtml = recipe.ingredients.map(ing => 
        `<li>${ing.quantity} ${ing.name}</li>`
      ).join('');

      document.getElementById('recipe-detail').innerHTML = `
        <h1>${recipe.name}</h1>
        <p><strong>Course:</strong> ${recipe.course}</p>
        <h3>Description</h3>
        <p>${recipe.description || 'No description available.'}</p>
        <h3>Ingredients</h3>
        <ul class="ingredients-list">
          ${ingredientsHtml}
        </ul>
        <button class="btn" onclick="history.back()">Go Back</button>
      `;
    }

    document.addEventListener('DOMContentLoaded', renderRecipeDetail);
  </script>

  <script src="../../src/scripts/nav-bar.js"></script>
  <script src="../../src/scripts/data.js"></script>
</body>
</html>
