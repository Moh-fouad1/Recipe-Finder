<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
</head>
<body>
        <h2>Signup</h2>
        <form action="/signup" method="POST">
            <div class = "form-group">
            <label for = "firstname">First Name:</label>
            <input type="text" id="firstname" name="firstname" required>
            </div>
            <br><br>

            <div class = "form-group">
            <label for = "lastname">Last Name:</label>
            <input type="text" id="lastname" name="lastname" required>
            </div>
            <br><br>

            <div class = "form-group">
            <label for = "phonenumber">Phone Number:</label>
            <input type="tel" id="phonenumber" name="phonenumber">
            </div>
            <br><br>

            <div class = "form-group">
            <label for = "AccountType">Account Type:</label>
            <select id="AccountType" name="AccountType" required>
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
            </div>
            <br><br>

            <div class = "form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            </div>
            <br><br>

            <div class = "form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            </div>
            <br><br>

            <div class = "form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            </div>
            <br><br>

            <div class = "form-group">
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <br><br>

            <div class = "form-group">
            <label for = "checkpasswordmatch">Check Password Match:</label>
            <input type="checkbox" id="checkpasswordmatch" name="checkpasswordmatch">
            </div>
            <br><br>

            <div class = "form-group">
            <label for = terms>Accept Terms and Conditions:</label>
            <input type="checkbox" id="terms" name="terms" required>
            </div>
            <br><br>

            <div class = "form-group">
            <button type="submit">Sign Up</button>
            </div>
        </form>
    <script>
        const password = document.getElementById('password');
        const confirm = document.getElementById('confirm_password');
        function checkMatch() {
            if (password.value !== confirm.value) {
            confirm.setCustomValidity('Passwords do not match');
            } else {
            confirm.setCustomValidity('');
            }
        }
        password.addEventListener('change', checkMatch);
        confirm.addEventListener('keyup', checkMatch);
    </script>
</body>
</html>
