{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block auth_title %}Recipe Finder{% endblock %}</title>
    {% block auth_css %}{% endblock %}
</head>
<body class="auth-page">
    {% if messages %}
        {% for message in messages %}
            <div class="auth-flash auth-flash-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
    <p class="auth-home-link"><a href="{% url 'home' %}">← Back to home</a></p>
    {% block auth_js %}{% endblock %}
</body>
</html>
