{% extends 'base.html' %}
{% load static %}
{% block title %}— Edit recipe{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/admin_style.css' %}">
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
{% endblock %}
{% block content %}
<h2>Edit recipe</h2>
<form method="post" enctype="multipart/form-data" class="admin-recipe-form">
    {% csrf_token %}
    {% include 'recipes/admin/_recipe_form.html' %}
    <div class="form-actions">
        <button type="submit" class="btn">Save changes</button>
        <a href="{% url 'recipes:manage_recipes' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
{% block extra_js %}
<script src="{% static 'js/admin_forms.js' %}"></script>
{% endblock %}
