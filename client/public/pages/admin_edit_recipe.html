<h1>Edit Recipe</h1>

<div class="form-container">
    <form id="edit-recipe-form">

        <label for="recipe-id">Recipe ID (Read-only)</label>
        <input type="number" id="recipe-id" required readonly>

        <label for="recipe-name">Recipe Name</label>
        <input type="text" id="recipe-name" placeholder="Enter recipe name" required>

        <label for="recipe-course">Course</label>
        <select id="recipe-course" required>
            <option value="Main Course">Main Course</option>
            <option value="Appetizers">Appetizers</option>
            <option value="Dessert">Dessert</option>
            <option value="Beverages">Beverages</option>
        </select>

        <h3>Ingredients</h3>
        <div id="ingredients-container">
        </div>
        <button type="button" class="btn btn-sm" onclick="addIngredientRow(document.getElementById('ingredients-container'), '', '', '')" style="margin-bottom: 2rem; background: #64748b;">+ Add Ingredient Row</button>

        <label for="recipe-desc">Description</label>
        <textarea id="recipe-desc" placeholder="Enter recipe description" required></textarea>

        <button type="submit" class="btn">Save Changes</button>
    </form>
</div>

</body>
