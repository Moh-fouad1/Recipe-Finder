{% extends 'base.html' %}
{% block content %}
<h1>Manage Recipes</h1>
<a href="{% url 'recipes:add_recipe' %}" class="btn">Add New Recipe</a>
<div class="table-container">
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Actions</th></tr></thead>
        <tbody>
            {% for recipe in recipes %}
            <tr>
                <td>{{ recipe.id }}</td>
                <td>{{ recipe.name }}</td>
                <td>{{ recipe.course }}</td>
                <td>
                    <a href="{% url 'recipes:edit_recipe' recipe.id %}">Edit</a>
                    <form method="post" action="{% url 'recipes:delete_recipe' recipe.id %}" style="display:inline;" onsubmit="return confirm('Delete recipe?');">
                        {% csrf_token %}
                        <button type="submit" class="btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
