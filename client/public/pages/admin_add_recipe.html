<!DOCTYPE html>
<html>
<head>
    <title>Add Recipe</title>
    <link rel="stylesheet" href="admin_style.css">
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="recipes.html">Recipes</a>
    <a href="favorites.html">Favorites</a>
    <a href="admin_manage_recipes.html">Manage Recipes</a>
    <a href="admin_add_recipe.html">Add Recipe</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Signup</a>
</nav>

<h2>Add New Recipe</h2>

<form id="recipeForm">
    <h3>Recipe Information</h3>
    <label>Recipe ID:</label>
    <input type="text" name="recipe_id" placeholder="Auto-generated if empty"><br><br>

    <label>Recipe Name:</label>
    <input type="text" name="recipe_name" required><br><br>

    <label>Course:</label>
    <select name="course">
        <option>Appetizers</option>
        <option>Main course</option>
        <option>Dessert</option>
    </select><br><br>

    <label>Description:</label><br>
    <textarea name="description" rows="4" cols="40"></textarea><br><br>

    <h3>Ingredients</h3>
    <div id="ingredientsContainer">
      
        <div class="ingredient-group">
            <label>Ingredient ID:</label>
            <input type="text" name="ingredient_id[]" placeholder="e.g., ING001">

            <label>Ingredient Name:</label>
            <input type="text" name="ingredient_name[]" placeholder="e.g., Flour" required>

            <label>Quantity:</label>
            <input type="text" name="quantity[]" placeholder="e.g., 2 cups" required>

            <button type="button" class="remove-ingredient" style="background:#e74c3c; width:auto; padding:5px 10px;">Remove</button>
            <hr>
        </div>
    </div>

    <button type="button" id="addIngredientBtn" style="background:#2c3e50; margin-bottom:20px;">+ Add Another Ingredient</button>
    <br>
    <button type="submit">Add Recipe</button>
</form>

<script src="admin_add_recipe.js"></script>
</body>
</html>
